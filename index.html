<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>润林牧场</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; color: #333; font-size: 16px; padding-bottom: 60px; position: relative; }
.header { background: #8bc34a; color: #fff; padding: 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
.search-box { display: flex; gap: 8px; margin-top: 10px; }
.search-box input { flex: 1; padding: 8px 12px; border: none; border-radius: 20px; outline: none; font-size: 14px; }
.search-box button { background: #fff; color: #8bc34a; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
.wechat-pay { background: #07c160; color: #fff; text-align: center; padding: 10px; margin: 10px; border-radius: 8px; font-size: 15px; cursor: pointer; }
.quick-entry { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; background: #fff; margin: 10px; border-radius: 8px; }
.quick-item { text-align: center; cursor: pointer; }
.quick-item div:first-child { font-size: 28px; margin-bottom: 5px; }
.quick-item div:last-child { font-size: 13px; color: #666; }
.stats-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; margin: 10px; background: #fff; border-radius: 8px; }
.stat-card { padding: 10px; background: #f9f9f9; border-radius: 6px; text-align: center; }
.stat-num { font-size: 22px; font-weight: bold; color: #8bc34a; }
.stat-label { font-size: 12px; color: #999; margin-top: 4px; }
.section-title { padding: 15px 15px 10px; font-size: 17px; font-weight: bold; }
.goods-list { padding: 0 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.goods-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.goods-img { height: 120px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #999; }
.goods-info { padding: 10px; }
.goods-name { font-size: 15px; font-weight: bold; margin-bottom: 5px; }
.goods-price { color: #f44336; font-size: 16px; font-weight: bold; }
.goods-btn { width: 100%; margin-top: 8px; padding: 6px; background: #8bc34a; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
.cart-icon { position: fixed; right: 15px; bottom: 75px; width: 50px; height: 50px; background: #ff5722; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.2); cursor: pointer; z-index: 99; }
#cartBadge { position: absolute; top: -5px; right: -5px; background: #f44336; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: none; align-items: center; justify-content: center; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #eee; z-index: 100; }
.nav-item { padding: 10px 0; text-align: center; font-size: 12px; color: #666; cursor: pointer; }
.nav-item.active { color: #8bc34a; }
.nav-icon { font-size: 22px; margin-bottom: 3px; }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: #fff; border-radius: 10px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; padding: 20px; }
.modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; }
.btn-primary { width: 100%; padding: 10px; background: #8bc34a; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
.btn-secondary { width: 100%; padding: 10px; background: #eee; color: #666; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 8px; }
input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
.setting-row label { flex: 1; }
.setting-row input[type=range] { flex: 1; }
#brightnessMask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; z-index: 50; }
#toast { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.8); color: #fff; padding: 12px 20px; border-radius: 6px; z-index: 999; font-size: 14px; }
.terms-html h4 { margin: 15px 0 8px; color: #8bc34a; }
.terms-html p { margin-bottom: 10px; line-height: 1.6; font-size: 14px; color: #555; }
</style>
</head>
<body>

<div id="brightnessMask"></div>

<div class="header">
  <div style="font-size:20px;font-weight:bold;">润林牧场</div>
  <div style="font-size:12px;opacity:.9;">新鲜 · 健康 · 直达</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索商品（羊肉/代养/饲料）">
    <button onclick="doSearch()">搜索</button>
  </div>
</div>

<div class="wechat-pay" onclick="showWechatPay()">💚 微信收款 / 扫码支付</div>

<div class="quick-entry">
  <div class="quick-item" onclick="filterGoods('meat')"><div>🥩</div><div>买肉</div></div>
  <div class="quick-item" onclick="filterGoods('raise')"><div>🐑</div><div>代养</div></div>
  <div class="quick-item" onclick="showOrders()"><div>📦</div><div>订单</div></div>
  <div class="quick-item" onclick="showOrders()"><div>📋</div><div>项单</div></div>
</div>

<div class="stats-panel">
  <div class="stat-card"><div class="stat-num" id="todayOrders">12</div><div class="stat-label">今日订单</div></div>
  <div class="stat-card"><div class="stat-num" id="monthOrders">386</div><div class="stat-label">本月订单</div></div>
  <div class="stat-card"><div class="stat-num" id="totalUsers">1256</div><div class="stat-label">注册用户</div></div>
  <div class="stat-card"><div class="stat-num" id="totalGoods">68</div><div class="stat-label">在售商品</div></div>
</div>

<div class="section-title">🔥 热销商品</div>
<div class="goods-list" id="goodsList"></div>

<div class="cart-icon" onclick="showCart()">🛒<span id="cartBadge">0</span></div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('home')"><div class="nav-icon">🏠</div><div>首页</div></div>
  <div class="nav-item" onclick="switchTab('category')"><div class="nav-icon">📂</div><div>分类</div></div>
  <div class="nav-item" onclick="switchTab('cart')"><div class="nav-icon">🛒</div><div>购物车</div></div>
  <div class="nav-item" onclick="showSettings()"><div class="nav-icon">⚙️</div><div>我的</div></div>
</div>

<!-- 登录/注册 -->
<div class="modal" id="loginModal">
  <div class="modal-content">
    <div class="modal-title" id="loginTitle">手机号登录</div>
    <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11">
    <input type="password" id="pwd" placeholder="请输入密码" id="loginPwd">
    <input type="text" id="code" placeholder="验证码（注册必填）" style="display:none;">
    <div style="text-align:right;font-size:13px;color:#8bc34a;cursor:pointer;margin-bottom:10px;" onclick="toggleLoginReg()">没有账号？注册</div>
    <button class="btn-primary" onclick="doLogin()">登录</button>
    <button class="btn-secondary" onclick="hideModal('loginModal')">取消</button>
  </div>
</div>

<!-- 购物车 -->
<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-title">购物车</div>
    <div id="cartList"></div>
    <div id="emptyCart" style="text-align:center;padding:20px;color:#999;">购物车空空如也</div>
    <div style="margin-top:15px;padding-top:15px;border-top:1px solid #eee;font-weight:bold;" id="cartTotal">合计：￥0</div>
    <button class="btn-primary" onclick="checkout()">结算</button>
    <button class="btn-secondary" onclick="hideModal('cartModal')">关闭</button>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-title">设置</div>
    <div class="setting-row">
      <label>字体大小</label>
      <input type="range" id="fontSlider" min="1" max="3" value="2" onchange="changeFont(this.value)">
      <span id="fontLabel">标准</span>
    </div>
    <div class="setting-row">
      <label>屏幕亮度</label>
      <input type="range" id="brightSlider" min="30" max="100" value="100" onchange="changeBrightness(this.value)">
      <span id="brightLabel">100%</span>
    </div>
    <div class="setting-row"><label>当前账号</label><span id="curUser">未登录</span></div>
    <button class="btn-primary" onclick="showPwdModal()">修改密码</button>
    <button class="btn-primary" onclick="showTerms('service')">用户服务协议</button>
    <button class="btn-primary" onclick="showTerms('privacy')">隐私政策</button>
    <button class="btn-secondary" onclick="doLogout()">退出登录</button>
    <button class="btn-secondary" onclick="hideModal('settingsModal')">关闭</button>
  </div>
</div>

<!-- 改密 -->
<div class="modal" id="pwdModal">
  <div class="modal-content">
    <div class="modal-title">修改密码</div>
    <input type="password" id="oldPwd" placeholder="原密码">
    <input type="password" id="newPwd" placeholder="新密码（至少6位）">
    <input type="password" id="newPwd2" placeholder="确认新密码">
    <button class="btn-primary" onclick="changePwd()">提交修改</button>
    <button class="btn-secondary" onclick="hideModal('pwdModal')">取消</button>
  </div>
</div>

<!-- 条款 -->
<div class="modal" id="termsModal">
  <div class="modal-content">
    <div class="modal-title" id="termsTitle">条款</div>
    <div class="terms-html" id="termsContent"></div>
    <button class="btn-primary" onclick="hideModal('termsModal')">我已阅读</button>
  </div>
</div>

<!-- 微信收款 -->
<div class="modal" id="wechatModal">
  <div class="modal-content">
    <div class="modal-title">微信收款</div>
    <div style="text-align:center;padding:20px;">
      <div style="font-size:60px;">💚</div>
      <div>请使用微信扫描收款码</div>
      <div style="color:#999;font-size:13px;margin-top:10px;">（演示版，实际需上传二维码图片）</div>
    </div>
    <button class="btn-secondary" onclick="hideModal('wechatModal')">关闭</button>
  </div>
</div>

<div id="toast"></div>

<script>
const goods = [
  {id:1,name:'精品羊排',price:68,tag:'meat',icon:'🥩'},
  {id:2,name:'鲜羊肉卷',price:45,tag:'meat',icon:'🍖'},
  {id:3,name:'羊腿肉',price:55,tag:'meat',icon:'🦵'},
  {id:4,name:'湖羊代养',price:1280,tag:'raise',icon:'🐑'},
  {id:5,name:'黑头羊代养',price:1580,tag:'raise',icon:'🐏'},
  {id:6,name:'青贮饲料',price:35,tag:'feed',icon:'🌾'}
];
let cart = JSON.parse(localStorage.getItem('cart')||'[]');
let users = JSON.parse(localStorage.getItem('users')||'{}');
let currentUser = localStorage.getItem('currentUser')||null;
let fontLevel = parseInt(localStorage.getItem('font')||'2');
let bright = parseInt(localStorage.getItem('bright')||'100');
let isReg = false;

if(!users['13800138000']) users['13800138000']={pwd:'123456',phone:'13800138000'};

function renderGoods(list) {
  const box = document.getElementById('goodsList');
  box.innerHTML = '';
  (list||goods).forEach(g => {
    box.innerHTML += `<div class="goods-card">
      <div class="goods-img">${g.icon}</div>
      <div class="goods-info">
        <div class="goods-name">${g.name}</div>
        <div class="goods-price">￥${g.price}</div>
        <button class="goods-btn" onclick="addCart(${g.id})">加入购物车</button>
      </div>
    </div>`;
  });
}
renderGoods();
applyFont(fontLevel);
applyBright(bright);
renderCart();

function doSearch() {
  const k = document.getElementById('searchInput').value.trim();
  if(!k) { renderGoods(); return; }
  renderGoods(goods.filter(g => g.name.includes(k)||g.tag.includes(k)));
}
function filterGoods(tag) { renderGoods(goods.filter(g => g.tag===tag)); }
function addCart(id) {
  const g = goods.find(x=>x.id===id);
  cart.push(g);
  localStorage.setItem('cart',JSON.stringify(cart));
  renderCart();
  showToast('已加入购物车');
}
function renderCart() {
  const list = document.getElementById('cartList');
  let total=0;
  list.innerHTML='';
  cart.forEach((x,i)=>{
    total+=x.price;
    list.innerHTML+=`<div class="cart-item"><span>${x.name} ￥${x.price}</span><button onclick="delCart(${i})" style="background:#f44336;color:#fff;border:none;padding:4px 10px;border-radius:4px;">删</button></div>`;
  });
  document.getElementById('cartTotal').innerText='合计：￥'+total;
  const badge=document.getElementById('cartBadge');
  badge.innerText=cart.length;
  badge.style.display=cart.length?'flex':'none';
  document.getElementById('emptyCart').style.display=cart.length?'none':'block';
}
function delCart(i) { cart.splice(i,1); localStorage.setItem('cart',JSON.stringify(cart)); renderCart(); }
function checkout() {
  if(!currentUser) { showToast('请先登录'); showLogin(); return; }
  if(!cart.length) { showToast('购物车为空'); return; }
  showToast('结算成功（演示）'); cart=[]; localStorage.setItem('cart','[]'); renderCart(); hideModal('cartModal');
}
function showCart() { if(!currentUser){showLogin();return;} renderCart(); document.getElementById('cartModal').classList.add('active'); }
function showLogin() { document.getElementById('loginModal').classList.add('active'); }
function toggleLoginReg() {
  isReg=!isReg;
  document.getElementById('loginTitle').innerText=isReg?'注册账号':'手机号登录';
  document.getElementById('code').style.display=isReg?'block':'none';
}
function doLogin() {
  const phone=document.getElementById('phone').value;
  const pwd=document.getElementById('pwd').value;
  if(isReg) {
    const code=document.getElementById('code').value;
    if(!code) { showToast('请输入验证码'); return; }
    users[phone]={pwd,phone};
    localStorage.setItem('users',JSON.stringify(users));
    showToast('注册成功，请登录');
    isReg=false; toggleLoginReg();
    return;
  }
  if(!users[phone]||users[phone].pwd!==pwd) { showToast('账号或密码错误'); return; }
  currentUser=phone;
  localStorage.setItem('currentUser',phone);
  document.getElementById('curUser').innerText=phone;
  hideModal('loginModal');
  showToast('登录成功');
}
function doLogout() { currentUser=null; localStorage.removeItem('currentUser'); hideModal('settingsModal'); showToast('已退出'); }
function showSettings() {
  if(!currentUser) { showLogin(); return; }
  document.getElementById('curUser').innerText=currentUser;
  document.getElementById('settingsModal').classList.add('active');
}
function switchTab(t) {
  if(t==='cart') showCart();
  else if(t==='category') { document.getElementById('searchInput').focus(); }
  else if(t==='home') { renderGoods(); window.scrollTo(0,0); }
}
function showOrders() { showToast('订单功能（演示）'); }
function showWechatPay() { document.getElementById('wechatModal').classList.add('active'); }
function changeFont(v) {
  fontLevel=v; localStorage.setItem('font',v); applyFont(v);
}
function applyFont(v) {
  document.body.style.fontSize=['14px','16px','18px'][v-1];
  const s=document.getElementById('fontSlider'); if(s) s.value=v;
  const l=document.getElementById('fontLabel'); if(l) l.innerText=['小','标准','大'][v-1];
}
function changeBrightness(v) {
  bright=v; localStorage.setItem('bright',v); applyBright(v);
}
function applyBright(v) {
  document.getElementById('brightnessMask').style.opacity=(100-v)/100;
  const s=document.getElementById('brightSlider'); if(s) s.value=v;
  const l=document.getElementById('brightLabel'); if(l) l.innerText=v+'%';
}
function showPwdModal() { hideModal('settingsModal'); document.getElementById('pwdModal').classList.add('active'); }
function changePwd() {
  const old=document.getElementById('oldPwd').value;
  const np=document.getElementById('newPwd').value;
  const np2=document.getElementById('newPwd2').value;
  if(users[currentUser].pwd!==old
