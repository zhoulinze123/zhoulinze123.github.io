<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8B4513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="润林牧场">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>润林牧场</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
var Tawk_API=Tawk_API||{},Tawk_LoadStart=new Date();
(function(){
  var s=document.createElement("script"),e=document.getElementsByTagName("script")[0];
  s.async=true;
  s.src='https://embed.tawk.to/YOUR_PROPERTY_ID/default';
  s.charset='UTF-8';
  s.setAttribute('crossorigin','*');
  e.parentNode.insertBefore(s,e);
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#333;font-size:15px;max-width:430px;margin:0 auto;padding-bottom:70px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
.header{background:#8B4513;color:#fff;padding:14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.logo{width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.title h1{font-size:19px;font-weight:bold}.title small{opacity:.85;font-size:11px}
.admin-entry{margin-left:auto;font-size:20px;cursor:pointer;opacity:.3;color:#fff}
.search{background:#8B4513;padding:0 12px 12px;display:flex;gap:8px}
.search input{flex:1;padding:10px 14px;border-radius:20px;border:none;font-size:14px;outline:none}
.search button{background:#D2691E;color:#fff;padding:0 18px;border-radius:20px;font-size:14px;white-space:nowrap}
.stats{display:flex;background:#fff;margin:10px;border-radius:10px;padding:12px 6px}
.stats div{text-align:center;flex:1}.stats b{color:#8B4513;font-size:18px;display:block}.stats span{font-size:11px;color:#999}
.goods{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.g-card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.g-img{height:120px;background:#f0f0f0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:8px;overflow:hidden;position:relative;cursor:pointer}
.g-img img{width:100%;height:100%;object-fit:cover}
.g-video{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;background:rgba(0,0,0,.65);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.g-name{font-size:14px;font-weight:bold;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-price{color:#e4393c;font-weight:bold;font-size:15px}.g-stock{font-size:12px;color:#999;margin:4px 0}
.g-btn{width:100%;padding:8px;background:#8B4513;color:#fff;border-radius:6px;font-size:13px;margin-top:4px}
.g-btn:disabled{background:#ccc;cursor:not-allowed}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#fff;display:flex;justify-content:space-around;padding:10px 0 15px;border-top:1px solid #eee;z-index:50}
.nav div{text-align:center;font-size:11px;color:#999;cursor:pointer}.nav .active{color:#8B4513}.nav span{font-size:22px;display:block;margin-bottom:2px}
.page{display:none}.page.active{display:block}
.mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.pop{background:#fff;border-radius:12px;width:100%;max-width:360px;padding:20px;position:relative;max-height:85vh;overflow-y:auto}
.pop-x{position:absolute;top:10px;right:15px;font-size:26px;color:#bbb;cursor:pointer;line-height:1}
.pop h3{margin-bottom:16px;font-size:17px;font-weight:bold}
.pop input,.pop textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:12px;outline:none}
.pop button{width:100%;padding:11px;background:#8B4513;color:#fff;border-radius:6px;margin-bottom:8px;font-size:14px}
.set-row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid #f0f0f0}
.set-row span{flex:1;font-size:14px}.set-row .ar{color:#ccc;font-size:18px}
.sw{width:44px;height:24px;background:#ccc;border-radius:12px;position:relative;cursor:pointer;flex-shrink:0}
.sw.on{background:#07C160}.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.25s}
.sw.on i{left:22px}
.admin-item{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.admin-item label{width:100%;font-weight:bold;color:#666;margin-bottom:2px}
.admin-item input{flex:1;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;min-width:0}
.admin-item input.wide{flex:100%;width:100%}
.img-viewer{position:fixed;inset:0;background:#000;z-index:300;display:none;align-items:center;justify-content:center}
.img-viewer.show{display:flex}
.img-viewer img{max-width:100%;max-height:100%;object-fit:contain}
.img-viewer .close{position:absolute;top:20px;right:20px;width:38px;height:38px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer}
.video-player{position:fixed;inset:0;background:#000;z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column}
.video-player.show{display:flex}
.video-player video{width:100%;max-height:80%}
.video-player .close{position:absolute;top:20px;right:20px;width:38px;height:38px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer}
.qr-box{text-align:center;padding:10px}
.qr-box div{margin:0 auto 12px}
.order-item{background:#f9f9f9;border-radius:8px;padding:12px;margin-bottom:10px;font-size:13px;line-height:1.8}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);color:#fff;padding:12px 22px;border-radius:8px;z-index:400;display:none;font-size:14px;white-space:nowrap}
.install-banner{position:fixed;top:0;left:0;right:0;max-width:430px;margin:0 auto;background:#8B4513;color:#fff;padding:10px 14px;display:none;align-items:center;gap:10px;font-size:13px;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.install-banner.show{display:flex}
.install-banner button{background:#fff;color:#8B4513;padding:6px 14px;border-radius:4px;font-size:12px;font-weight:bold;flex-shrink:0}
.install-banner .close{font-size:20px;opacity:.7;cursor:pointer;flex-shrink:0}
.section-title{font-size:16px;font-weight:bold;padding:14px 12px 8px;color:#333}
.user-card{background:#fff;margin:10px;border-radius:10px;padding:20px;text-align:center}
.user-card .avatar{font-size:44px;margin-bottom:6px}
.user-card .nick{font-size:16px;font-weight:bold}
.menu-list{background:#fff;margin:10px;border-radius:10px;overflow:hidden}
.menu-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.menu-item:last-child{border-bottom:none}
.menu-item .icon{font-size:20px;margin-right:12px;width:28px;text-align:center}
.menu-item .label{flex:1;font-size:14px}
.menu-item .arrow{color:#ccc;font-size:18px}
</style>
</head>
<body>

<div class="install-banner" id="installBanner">
  <span style="flex:1">📲 添加到手机桌面，像App一样使用</span>
  <button onclick="doInstall()">安装</button>
  <span class="close" onclick="this.parentElement.classList.remove('show')">×</span>
</div>

<div id="pageHome" class="page active">
  <div class="header">
    <div class="logo">🐑</div>
    <div class="title"><h1>润林牧场</h1><small>新鲜牛羊肉 · 直达餐桌</small></div>
  </div>
  <div class="search">
    <input id="kw" placeholder="搜索商品，如：羊排、五花肉" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div class="stats">
    <div><b id="sToday">0</b><span>今日订单</span></div>
    <div><b id="sMonth">0</b><span>本月订单</span></div>
    <div><b id="sWaitPay">0</b><span>待付款</span></div>
    <div><b id="sWaitSend">0</b><span>待发货</span></div>
    <div><b id="sDone">0</b><span>已完成</span></div>
  </div>
  <div class="section-title">🥩 推荐商品</div>
  <div class="goods" id="goodsList"></div>
</div>

<div id="pageMe" class="page">
  <div class="header">
    <div class="logo">👤</div>
    <div class="title"><h1>我的</h1></div>
    <div class="admin-entry" onclick="showMask('mPwd')" title="管理后台">⚙️</div>
  </div>
  <div class="user-card">
    <div class="avatar">👤</div>
    <div class="nick" id="uname">未登录</div>
    <button class="btn" style="margin-top:10px;padding:8px 24px;border-radius:20px" onclick="showMask('mLogin')">登录 / 注册</button>
  </div>
  <div class="menu-list">
    <div class="menu-item" onclick="showMask('mOrder')"><span class="icon">📦</span><span class="label">我的订单</span><span class="arrow">›</span></div>
    <div class="menu-item" onclick="showMask('mShare')"><span class="icon">📤</span><span class="label">分享给好友</span><span class="arrow">›</span></div>
    <div class="menu-item" onclick="showMask('mSet')"><span class="icon">⚙️</span><span class="label">设置</span><span class="arrow">›</span></div>
    <div class="menu-item" onclick="Tawk_API&&Tawk_API.maximize&&Tawk_API.maximize()"><span class="icon">💬</span><span class="label">联系客服</span><span class="arrow">›</span></div>
  </div>
</div>

<!-- 弹窗们 -->
<div class="mask" id="mPwd"><div class="pop"><div class="pop-x" onclick="hideMask('mPwd')">×</div><h3>🔒 管理验证</h3><input id="pwd" type="password" placeholder="请输入管理密码"><button onclick="chkPwd()">进入后台</button></div></div>
<div class="mask" id="mAdmin"><div class="pop"><div class="pop-x" onclick="hideMask('mAdmin')">×</div><h3>🛠 商品管理</h3><div id="adminBox"></div><button onclick="saveAdmin()" style="background:#07C160">💾 保存修改</button><button onclick="addGoods()" style="background:#D2691E">➕ 新增商品</button></div></div>
<div class="mask" id="mLogin"><div class="pop"><div class="pop-x" onclick="hideMask('mLogin')">×</div><h3>登录</h3><input id="lPhone" placeholder="手机号"><input id="lPwd" type="password" placeholder="密码（随便填）"><button onclick="doLogin()">登录</button></div></div>
<div class="mask" id="mOrder"><div class="pop"><div class="pop-x" onclick="hideMask('mOrder')">×</div><h3>我的订单</h3><div id="orderBox"></div></div></div>
<div class="mask" id="mSet"><div class="pop"><div class="pop-x" onclick="hideMask('mSet')">×</div><h3>设置</h3><div class="set-row"><span>🔔 订单通知</span><div class="sw on" id="sw1" onclick="this.classList.toggle('on')"><i></i></div></div><div class="set-row"><span>📢 促销通知</span><div class="sw on" id="sw2" onclick="this.classList.toggle('on')"><i></i></div></div><div class="set-row"><span>🔤 字体大小</span><select onchange="document.body.style.fontSize=this.value" style="border:none;background:transparent;font-size:14px"><option value="14px">小</option><option value="15px" selected>中</option><option value="16px">大</option></select><span class="ar">›</span></div><div class="set-row" onclick="clearCache()"><span>🗑️ 清除缓存</span><span class="ar">›</span></div></div></div>
<div class="mask" id="mShare"><div class="pop"><div class="pop-x" onclick="hideMask('mShare')">×</div><h3>分享润林牧场</h3><div class="qr-box"><div id="qr"></div><p style="font-size:12px;color:#999;margin-bottom:12px">扫码或复制链接分享给好友</p><button style="background:#07C160" onclick="copyLink()">📋 复制链接</button></div></div></div>
<div class="img-viewer" id="imgViewer"><div class="close" onclick="hideMask('imgViewer')">×</div><img id="bigImg" src=""></div>
<div class="video-player" id="videoPlayer"><div class="close" onclick="hideMask('videoPlayer');document.getElementById('vid').pause()">×</div><video id="vid" controls></video></div>
<div class="toast" id="toast"></div>

<div class="nav">
  <div class="active" onclick="switchPage('pageHome',this)"><span>🏠</span>首页</div>
  <div onclick="switchPage('pageMe',this)"><span>👤</span>我的</div>
</div>

<script>
// ===== PWA 安装 =====
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('installBanner').classList.add('show');
});
function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{document.getElementById('installBanner').classList.remove('show');deferredPrompt=null})}
}

// ===== 数据 =====
let goods=JSON.parse(localStorage.getItem('rl_goods'))||[
 {id:1,name:"鲜羊排 500g",price:68,stock:0,img:"🍖",imgUrl:"",videoUrl:""},
 {id:2,name:"羔羊肉卷 300g",price:45,stock:5,img:"🥩",imgUrl:"",videoUrl:""},
 {id:3,name:"牛腩块 500g",price:55,stock:0,img:"🐮",imgUrl:"",videoUrl:""},
 {id:4,name:"五花肉 500g",price:42,stock:0,img:"🥓",imgUrl:"",videoUrl:""},
 {id:5,name:"全羊代养 1年",price:2888,stock:2,img:"🐑",imgUrl:"",videoUrl:""},
 {id:6,name:"牧草饲料 10kg",price:35,stock:10,img:"🌾",imgUrl:"",videoUrl:""}
];
let orders=JSON.parse(localStorage.getItem('rl_orders')||'[]');
let cart=JSON.parse(localStorage.getItem('rl_cart')||'[]');
let curUser=localStorage.getItem('rl_cur')||null;

// ===== 渲染 =====
function render(){
  document.getElementById('goodsList').innerHTML=goods.map(g=>`
    <div class="g-card">
      <div class="g-img" onclick="viewImg('${g.imgUrl}','${g.img}')">
        ${g.imgUrl?`<img src="${g.imgUrl}">`:g.img}
        ${g.videoUrl?`<div class="g-video" onclick="event.stopPropagation();playVideo('${g.videoUrl}')">▶</div>`:''}
      </div>
      <div class="g-name">${g.name}</div>
      <div class="g-price">¥${g.price}</div>
      <div class="g-stock">${g.stock>0?'库存 '+g.stock:'⚠️ 库存为零'}</div>
      <button class="g-btn" ${g.stock==0?'disabled':''} onclick="addCart(${g.id})">${g.stock==0?'暂时无货':'加入购物车'}</button>
    </div>`).join('');
  localStorage.setItem('rl_goods',JSON.stringify(goods));
  let done=orders.filter(o=>o.status==='已完成').length;
  document.getElementById('sDone').innerText=done;
  document.getElementById('sWaitPay').innerText=orders.filter(o=>o.status==='待付').length;
  document.getElementById('sWaitSend').innerText=orders.filter(o=>o.status==='待发').length;
  if(curUser)document.getElementById('uname').innerText=curUser;
}
function viewImg(u,e){if(!u){showToast('暂无图片');return}document.getElementById('bigImg').src=u;showMask('imgViewer')}
function playVideo(u){if(!u){showToast('暂无视频');return}document.getElementById('vid').src=u;showMask('videoPlayer')}
function doSearch(){
  let k=document.getElementById('kw').value.trim();if(!k){render();return}
  let r=goods.filter(g=>g.name.includes(k));
  if(!r.length||r.every(g=>g.stock===0)){document.getElementById('goodsList').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999">没有找到匹配商品或库存为零</div>';return}
  document.getElementById('goodsList').innerHTML=r.map(g=>`<div class="g-card"><div class="g-img" onclick="viewImg('${g.imgUrl}','${g.img}')">${g.imgUrl?`<img src="${g.imgUrl}">`:g.img}${g.videoUrl?`<div class="g-video" onclick="event.stopPropagation();playVideo('${g.videoUrl}')">▶</div>`:''}</div><div class="g-name">${g.name}</div><div class="g-price">¥${g.price}</div><div class="g-stock">${g.stock>0?'库存 '+g.stock:'库存为零'}</div><button class="g-btn" ${g.stock==0?'disabled':''} onclick="addCart(${g.id})">${g.stock==0?'暂时无货':'加入购物车'}</button></div>`).join('');
}
function addCart(id){
  if(!curUser){showToast('请先登录');showMask('mLogin');return}
  let g=goods.find(x=>x.id==id);
  if(g&&g.stock>0){g.stock--;cart.push({n:g.name,p:g.price,t:Date.now()});localStorage.setItem('rl_cart',JSON.stringify(cart));localStorage.setItem('rl_goods',JSON.stringify(goods));render();showToast('已加入购物车');setTimeout(()=>checkout(),800)}
}
function checkout(){
  if(!cart.length)return;
  let sum=cart.reduce((s,i)=>s+i.p,0);
  orders.push({no:'RL'+Date.now(),items:[...cart],total:sum,status:'待发',time:new Date().toLocaleString()});
  localStorage.setItem('rl_orders',JSON.stringify(orders));
  cart=[];localStorage.removeItem('rl_cart');render();showToast('下单成功！合计 ¥'+sum);
}
function switchPage(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav div').forEach(n=>n.classList.remove('active'));el.classList.add('active')}
function showMask(id){document.getElementById(id).classList.add('show')}
function hideMask(id){document.getElementById(id).classList.remove('show')}
function showToast(t){let x=document.getElementById('toast');x.innerText=t;x.style.display='block';setTimeout(()=>x.style.display='none',2000)}
function copyLink(){navigator.clipboard.writeText(location.href);showToast('链接已复制')}
function clearCache(){localStorage.removeItem('rl_cart');cart=[];showToast('缓存已清除')}
function doLogin(){let p=document.getElementById('lPhone').value;if(p){curUser=p;localStorage.setItem('rl_cur',p);document.getElementById('uname').innerText=p;hideMask('mLogin');showToast('登录成功');render()}else{showToast('请输入手机号')}}
function chkPwd(){if(document.getElementById('pwd').value=='668899'){hideMask('mPwd');openAdmin()}else{showToast('密码错误')}}
function openAdmin(){
  document.getElementById('adminBox').innerHTML=goods.map((g,i)=>`<div class="admin-item"><label>商品 ${i+1}</label><input value="${g.img}" onchange="goods[${i}].img=this.value" placeholder="图标" style="width:50px"><input value="${g.name}" onchange="goods[${i}].name=this.value" placeholder="名称"><input value="${g.price}" type="number" onchange="goods[${i}].price=Number(this.value)" placeholder="价格" style="width:65px"><input value="${g.stock}" type="number" onchange="goods[${i}].stock=Number(this.value)" placeholder="库存" style="width:55px"><input class="wide" value="${g.imgUrl}" onchange="goods[${i}].imgUrl=this.value" placeholder="图片链接（填真实图片URL）"><input class="wide" value="${g.videoUrl}" onchange="goods[${i}].videoUrl=this.value" placeholder="视频链接（填MP4地址）"><button class="btn-red" onclick="goods.splice(${i},1);openAdmin()" style="padding:4px 10px;border-radius:4px;color:#fff">删除</button></div>`).join('');
  showMask('mAdmin');
}
function saveAdmin(){localStorage.setItem('rl_goods',JSON.stringify(goods));render();hideMask('mAdmin');showToast('✅ 保存成功')}
function addGoods(){goods.push({id:Date.now(),name:'新商品',price:0,stock:0,img:'🆕',imgUrl:'',videoUrl:''});openAdmin()}

// 分享二维码
function genQR(){let q=document.getElementById('qr');q.innerHTML='';new QRCode(q,{text:location.href,width:160,height:160})}

// 订单展示
function showOrders(){
  let box=document.getElementById('orderBox');
  if(!orders.length){box.innerHTML='<p style="text-align:center;color:#999;padding:20px">暂无订单</p>';return}
  box.innerHTML=orders.map(o=>`<div class="order-item"><b>订单号：</b>${o.no}<br><b>商品：</b>${o.items.map(i=>i.n).join('、')}<br><b>合计：</b>¥${o.total}<br><b>状态：</b>${o.status}<br><b>时间：</b>${o.time}</div>`).join('');
}

// 监听弹窗打开
document.querySelectorAll('.mask').forEach(m=>{
  m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
});

// 注册Service Worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

// 初始化
render();
genQR();
showOrders();
</script>
</body>
</html>
