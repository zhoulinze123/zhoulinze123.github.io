 <!DOCTYPE html>
<html lang="zh-CN">
<link rel="manifest" href="./manifest.json">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>润林牧场 · 鲜肉商城</title>
<meta name="theme-color" content="#8B4513">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#333;padding-bottom:60px;font-size:14px}
.header{background:linear-gradient(135deg,#8B4513,#A0522D);color:#fff;padding:12px 15px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-top{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700}
.weather-bar{font-size:12px;opacity:.95;cursor:pointer;background:rgba(255,255,255,.15);padding:4px 8px;border-radius:12px}
.search-box{background:rgba(255,255,255,.15);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px;margin-top:8px}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px}
.search-box input::placeholder{color:rgba(255,255,255,.7)}
.search-btn{background:#FF8C00;color:#fff;border:none;padding:6px 14px;border-radius:20px;font-size:13px}
.page{display:none;padding:10px}
.page.active{display:block}
.banner{background:linear-gradient(135deg,#FF8C00,#FF6B35);border-radius:12px;padding:15px;color:#fff;margin-bottom:12px}
.banner h2{font-size:20px;margin-bottom:6px}
.banner p{font-size:13px;opacity:.95}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.cat-item{background:#fff;border-radius:10px;padding:10px 5px;text-align:center;font-size:12px;cursor:pointer}
.cat-item.active{background:#8B4513;color:#fff}
.goods-card{background:#fff;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:10px}
.goods-img{width:70px;height:70px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.goods-info{flex:1}
.goods-name{font-weight:600;font-size:15px;margin-bottom:3px}
.goods-desc{font-size:12px;color:#888;margin-bottom:5px}
.goods-price{color:#d2691e;font-weight:700;font-size:16px}
.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tool-card{background:#fff;border-radius:10px;padding:12px 5px;text-align:center;font-size:12px;cursor:pointer}
.tool-card:active{background:#f0f0f0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:100}
.nav-item{text-align:center;font-size:11px;color:#666;cursor:pointer}
.nav-item.active{color:#8B4513}
.nav-icon{font-size:20px;margin-bottom:2px}
.promo-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;padding:20px;overflow-y:auto}
.promo-modal.active{display:block}
.promo-content{background:#fff;border-radius:12px;padding:15px;margin-top:20px;max-width:500px;margin-left:auto;margin-right:auto}
.promo-tabs{display:flex;gap:8px;margin-bottom:12px}
.promo-tab{padding:6px 12px;border-radius:20px;background:#f0f0f0;font-size:13px;cursor:pointer;border:none}
.promo-tab.active{background:#8B4513;color:#fff}
.compare-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.compare-table th,.compare-table td{border:1px solid #ddd;padding:6px;text-align:center}
.compare-table th{background:#f8f8f8}
.order-form{background:#fff;border-radius:10px;padding:15px;margin-top:10px}
.order-form input,.order-form textarea,.order-form select{width:100%;padding:8px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.submit-btn{background:#8B4513;color:#fff;border:none;padding:10px;width:100%;border-radius:8px;font-size:15px;cursor:pointer}
.submit-btn:active{opacity:.8}
.section-title{font-weight:700;margin:15px 0 10px;font-size:15px}
.empty-tip{text-align:center;color:#999;padding:20px;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>🐑 润林牧场</h1>
    <div class="weather-bar" id="weatherText" onclick="refreshWeather()">📍 定位中... 点击刷新</div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索商品，如：羊排">
    <button class="search-btn" onclick="doSearch()">搜索</button>
  </div>
</div>

<div class="page active" id="pageHome">
  <div class="banner">
    <h2>🥩 农村散养 · 现宰现发</h2>
    <p>土猪 / 土鸡 / 土鸭，地道农家味</p>
  </div>
  <div class="section-title">📦 全部商品 <span style="float:right;font-size:12px;color:#8B4513;cursor:pointer" onclick="switchTab('cat')">分类 ›</span></div>
  <div id="homeGoodsList"></div>
</div>

<div class="page" id="pageCat">
  <div class="section-title">🔥 商品分类</div>
  <div class="cat-grid" id="catGrid"></div>
  <div class="section-title">🛠 工具与服务</div>
  <div class="tool-grid">
    <div class="tool-card" onclick="showPromo()">📢 宣传与科普</div>
    <div class="tool-card" onclick="alert('称重换算：1斤=500克\n活猪出肉率约60-65%')">⚖️ 称重换算</div>
    <div class="tool-card" onclick="alert('链接已复制，发给朋友吧！')">🔗 分享商城</div>
  </div>
  <div class="section-title">📦 商品列表</div>
  <div id="catGoodsList"></div>
</div>

<div class="page" id="pageOrder">
  <div class="section-title">📝 我要订货</div>
  <div class="order-form">
    <input type="text" id="orderName" placeholder="姓名 *">
    <input type="tel" id="orderPhone" placeholder="电话 *">
    <select id="orderProvince"><option value="">选择省份</option><option>四川省</option><option>重庆市</option><option>贵州省</option><option>云南省</option><option>广东省</option></select>
    <select id="orderCity"><option value="">选择城市</option><option>成都市</option><option>绵阳市</option><option>南充市</option></select>
    <input type="text" id="orderAddr" placeholder="详细地址 *">
    <textarea id="orderGoods" placeholder="要什么肉 / 多少斤（如：土猪五花肉3斤）" rows="3"></textarea>
    <textarea id="orderNote" placeholder="备注（可选）" rows="2"></textarea>
    <button class="submit-btn" onclick="submitOrder()">提交订货单</button>
  </div>
  <div class="section-title">📜 我的订货记录</div>
  <div id="orderHistory"></div>
</div>

<div class="page" id="pageMe">
  <div style="background:linear-gradient(135deg,#8B4513,#A0522D);border-radius:12px;padding:20px;color:#fff;text-align:center;margin-bottom:15px">
    <div style="font-size:42px;margin-bottom:8px">👤</div>
    <div style="font-size:16px;font-weight:600">润林牧场客户</div>
    <div style="font-size:12px;opacity:.8;margin-top:4px">管理密码 668899</div>
  </div>
  <div class="tool-grid">
    <div class="tool-card" onclick="switchTab('order')">📦 订货记录</div>
    <div class="tool-card" onclick="showPromo()">📖 品质科普</div>
    <div class="tool-card" onclick="callPhone()">📞 联系商家</div>
    <div class="tool-card" onclick="alert('微信号: runlin123\n（点击复制）')">💬 微信客服</div>
    <div class="tool-card" onclick="alert('功能开发中，敬请期待')">⚙️ 设置</div>
    <div class="tool-card" onclick="clearData()">🗑 清除数据</div>
  </div>
</div>

<div class="promo-modal" id="promoModal">
  <div class="promo-content">
    <div class="promo-tabs">
      <button class="promo-tab active" onclick="switchPromo('pig',this)">🐷 土猪</button>
      <button class="promo-tab" onclick="switchPromo('chicken',this)">🐔 土鸡</button>
      <button class="promo-tab" onclick="switchPromo('duck',this)">🦆 土鸭</button>
    </div>
    <div id="promoContent"></div>
    <button class="submit-btn" onclick="closePromo()" style="margin-top:15px;background:#999">关闭</button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" data-page="home" onclick="switchTab('home')"><div class="nav-icon">🏠</div>首页</div>
  <div class="nav-item" data-page="cat" onclick="switchTab('cat')"><div class="nav-icon">🔍</div>分类</div>
  <div class="nav-item" data-page="order" onclick="switchTab('order')"><div class="nav-icon">📦</div>订单</div>
  <div class="nav-item" data-page="me" onclick="switchTab('me')"><div class="nav-icon">👤</div>我的</div>
</div>

<script>
var goods = [
  {name:"土猪五花肉",desc:"农村散养·肥瘦相间·红烧首选",price:38,icon:"🥩",cat:"猪"},
  {name:"土猪前腿肉",desc:"肉质紧实·适合红烧/炒肉丝",price:35,icon:"🥩",cat:"猪"},
  {name:"土猪排骨",desc:"新鲜现宰·骨髓饱满·煲汤佳品",price:42,icon:"🍖",cat:"猪"},
  {name:"土猪后腿肉",desc:"精瘦为主·适合炒/卤/做馅",price:32,icon:"🥩",cat:"猪"},
  {name:"散养土鸡",desc:"山林放养·汤鲜肉紧·满山跑",price:68,icon:"🐔",cat:"鸡"},
  {name:"土鸡蛋 30枚",desc:"五谷喂养·蛋黄金黄·无激素",price:28,icon:"🥚",cat:"鸡"},
  {name:"散养土鸭",desc:"稻田放养·吃鱼虾水草·肉质鲜美",price:58,icon:"🦆",cat:"鸭"},
  {name:"鲜羊排",desc:"鲜嫩无膻·炭烤/红烧皆宜",price:65,icon:"🐑",cat:"羊"},
  {name:"羊腿肉",desc:"精瘦为主·炖煮/爆炒",price:55,icon:"🐑",cat:"羊"}
];

var promoData = {
  pig: {
    title: "🐷 润林土猪",
    desc: "农村传统饲养，周期12个月以上，吃玉米/红薯/野菜，肉质紧实、肥而不腻。",
    table: [["对比项","润林土猪","普通饲料猪"],["饲养周期","12个月+","4-5个月"],["喂养方式","五谷+野菜","全价饲料"],["运动量","山地散养","圈养不动"],["口感","香嫩有嚼劲","松散腥味重"],["肥肉","晶莹不腻","油腻腻口"]]
  },
  chicken: {
    title: "🐔 润林土鸡",
    desc: "山林散养，满山跑，吃虫吃谷，炖汤金黄鲜美，肉紧皮脆。",
    table: [["对比项","润林土鸡","速成肉鸡"],["饲养周期","8个月+","40天"],["活动量","大（山林）","极小（笼养）"],["食物","虫+谷+草","全价饲料"],["汤色","金黄浓郁","清淡寡水"],["肉质","紧实有弹性","松散发柴"]]
  },
  duck: {
    title: "🦆 润林土鸭",
    desc: "稻田放养，吃鱼虾水草，肉质紧实，炖汤鲜甜，烧鸭更香。",
    table: [["对比项","润林土鸭","圈养肉鸭"],["饲养周期","6个月+","40天"],["环境","稻田/水塘","密集棚养"],["食物","鱼虾+水草+稻谷","全价饲料"],["油脂","少而香","多而腻"],["口感","紧实鲜甜","偏肥腥"]]
  }
};

var curCat = "全部";

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.querySelector('.nav-item[data-page="' + tab + '"]').classList.add('active');
  if (tab === 'cat') { renderCatGrid(); renderCatGoods('全部'); }
  if (tab === 'order') showOrderHistory();
  if (tab === 'home') renderGoodsList(goods, 'homeGoodsList');
}

function renderCatGrid() {
  var cats = ["全部","猪","鸡","鸭","羊"];
  var html = '';
  for (var i = 0; i < cats.length; i++) {
    html += '<div class="cat-item ' + (cats[i] === curCat ? 'active' : '') + '" onclick="filterCat(\'' + cats[i] + '\')"><div style="font-size:20px;margin-bottom:4px">' + (cats[i]==='全部'?'🍽️':cats[i]==='猪'?'🐷':cats[i]==='鸡'?'🐔':cats[i]==='鸭'?'🦆':'🐑') + '</div>' + cats[i] + '</div>';
  }
  document.getElementById('catGrid').innerHTML = html;
}

function filterCat(c) {
  curCat = c;
  renderCatGrid();
  if (c === '全部') renderCatGoods('全部');
  else renderCatGoods(c);
}

function renderCatGoods(cat) {
  var list = cat === '全部' ? goods : goods.filter(function(g) { return g.cat === cat; });
  renderGoodsList(list, 'catGoodsList');
}

function renderGoodsList(list, id) {
  if (!list.length) {
    document.getElementById(id).innerHTML = '<div class="empty-tip">暂无商品</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var g = list[i];
    html += '<div class="goods-card"><div class="goods-img">' + g.icon + '</div><div class="goods-info"><div class="goods-name">' + g.name + '</div><div class="goods-desc">' + g.desc + '</div><div class="goods-price">¥' + g.price + '/斤</div></div></div>';
  }
  document.getElementById(id).innerHTML = html;
}

function doSearch() {
  var kw = document.getElementById('searchInput').value.trim();
  if (!kw) { renderGoodsList(goods, 'homeGoodsList'); return; }
  var result = goods.filter(function(g) { return g.name.indexOf(kw) !== -1 || g.desc.indexOf(kw) !== -1; });
  renderGoodsList(result, 'homeGoodsList');
}

function showPromo() {
  document.getElementById('promoModal').classList.add('active');
  switchPromo('pig', document.querySelector('.promo-tab'));
}

function closePromo() {
  document.getElementById('promoModal').classList.remove('active');
}

function switchPromo(type, el) {
  document.querySelectorAll('.promo-tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  var d = promoData[type];
  var tableHtml = '<table class="compare-table"><tr>';
  for (var i = 0; i < d.table[0].length; i++) tableHtml += '<th>' + d.table[0][i] + '</th>';
  tableHtml += '</tr>';
  for (var r = 1; r < d.table.length; r++) {
    tableHtml += '<tr>';
    for (var c = 0; c < d.table[r].length; c++) tableHtml += '<td>' + d.table[r][c] + '</td>';
    tableHtml += '</tr>';
  }
  tableHtml += '</table>';
  document.getElementById('promoContent').innerHTML = '<h3 style="color:#8B4513;margin-bottom:8px">' + d.title + '</h3><p style="margin-bottom:10px;color:#555;line-height:1.6">' + d.desc + '</p>' + tableHtml + '<p style="margin-top:10px;color:#d2691e;font-weight:700">👉 认准润林牧场，地道农家味！</p>';
}

function submitOrder() {
  var name = document.getElementById('orderName').value.trim();
  var phone = document.getElementById('orderPhone').value.trim();
  var addr = document.getElementById('orderAddr').value.trim();
  var goodsText = document.getElementById('orderGoods').value.trim();
  if (!name || !phone || !addr) { alert('请填写姓名、电话和地址（标*的）'); return; }
  var order = {name:name, phone:phone, addr:addr, goods:goodsText, note:document.getElementById('orderNote').value.trim(), time:new Date().toLocaleString()};
  var orders = JSON.parse(localStorage.getItem('orders') || '[]');
  orders.unshift(order);
  localStorage.setItem('orders', JSON.stringify(orders));
  alert('✅ 订货单提交成功！我们会尽快联系您。');
  document.getElementById('orderName').value = '';
  document.getElementById('orderPhone').value = '';
  document.getElementById('orderAddr').value = '';
  document.getElementById('orderGoods').value = '';
  document.getElementById('orderNote').value = '';
  showOrderHistory();
}

function showOrderHistory() {
  var orders = JSON.parse(localStorage.getItem('orders') || '[]');
  var container = document.getElementById('orderHistory');
  if (!orders.length) { container.innerHTML = '<div class="empty-tip">暂无订货记录</div>'; return; }
  var html = '';
  for (var i = 0; i < orders.length; i++) {
    var o = orders[i];
    html += '<div style="background:#fff;padding:10px;border-radius:8px;margin-bottom:8px;font-size:12px"><b>' + o.name + '</b> ' + o.phone + '<br>' + o.addr + '<br><span style="color:#d2691e">' + (o.goods || '未指定商品') + '</span>' + (o.note ? '<br>📝 ' + o.note : '') + '<br><small style="color:#999">' + o.time + '</small></div>';
  }
  container.innerHTML = html;
}

function callPhone() {
  window.location.href = 'tel:18011452292';
}

function clearData() {
  if (!confirm('确定清除所有本地数据？此操作不可恢复！')) return;
  localStorage.removeItem('orders');
  alert('已清除');
  document.getElementById('orderHistory').innerHTML = '<div class="empty-tip">暂无订货记录</div>';
}

function refreshWeather() {
  document.getElementById('weatherText').innerText = '📍 定位中... 点击刷新';
  autoLocate();
}

function autoLocate() {
  var done = false;
  setTimeout(function() {
    if (!done) { done = true; document.getElementById('weatherText').innerText = '📍 成都 🌤 22°C'; }
  }, 2000);
  if (!navigator.geolocation) { done = true; document.getElementById('weatherText').innerText = '📍 成都 🌤 22°C'; return; }
  navigator.geolocation.getCurrentPosition(function(pos) {
    if (done) return; done = true;
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + pos.coords.latitude + '&longitude=' + pos.coords.longitude + '&current=temperature_2m&timezone=Asia/Shanghai')
      .then(function(r) { return r.json(); })
      .then(function(d) { document.getElementById('weatherText').innerText = '📍 当前 ' + Math.round(d.current.temperature_2m) + '°C'; })
      .catch(function() { document.getElementById('weatherText').innerText = '📍 成都 🌤 22°C'; });
  }, function() {
    if (!done) { done = true; document.getElementById('weatherText').innerText = '📍 成都 🌤 22°C'; }
  }, {timeout: 1500});
}

<!-- 分享按钮 -->
<div style="margin:12px 16px;">
  <button onclick="shareShop()" style="width:100%;padding:12px;background:#ff7800;color:#fff;border:none;border-radius:8px;font-size:16px;">📤 分享店铺给好友</button>
</div>

<script>
function shareShop(){
  const shareData = {
    title:"润林牧场农家生鲜",
    text:"农家散养土猪土鸡，点链接进店选购",
    url:"https://zhoulinze123.github.io/zhoulinze123.github.io/"
  }
  if(navigator.share){
    navigator.share(shareData).catch(err=>{
      copyLink();
    })
  }else{
    copyLink();
  }
}
function copyLink(){
  navigator.clipboard.writeText("https://zhoulinze123.github.io/zhoulinze123.github.io/");
  alert("链接已经复制！粘贴发给微信好友即可");
}
</script>
renderGoodsList(goods, 'homeGoodsList');
autoLocate();
</script>
 <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>

</body>
</html>
